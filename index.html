<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B57CF">
<title>Artikel-Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one narrow column, app-like; home = status + modes + ranking, game = full-focus card with three colour keys */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunk:#E6E9F0; --ink:#151924; --muted:#5B6274; --line:#D8DDE7;
  --der:#2B57CF; --die:#CF3535; --das:#178F5A; --gold:#C98A06; --gold-soft:#FBEFD2;
  --der-soft:#E3EAFB; --die-soft:#FBE4E4; --das-soft:#DDF3E8;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#171B24; --sunk:#202532; --ink:#ECEEF4; --muted:#9BA2B4; --line:#2A303D;
  --der:#7096FF; --die:#FF6E6E; --das:#3CCB8B; --gold:#F2BE3D; --gold-soft:#3A2F12;
  --der-soft:#1C2847; --die-soft:#40191B; --das-soft:#123528; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B24; --sunk:#202532; --ink:#ECEEF4; --muted:#9BA2B4; --line:#2A303D;
  --der:#7096FF; --die:#FF6E6E; --das:#3CCB8B; --gold:#F2BE3D; --gold-soft:#3A2F12;
  --der-soft:#1C2847; --die-soft:#40191B; --das-soft:#123528; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--der);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1;display:flex;gap:2px;align-items:baseline}
.brand i{font-style:normal}
.brand .d1{color:var(--der)} .brand .d2{color:var(--die)} .brand .d3{color:var(--das)}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.chip svg{width:16px;height:16px}

/* status card */
.status{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lvl{width:64px;height:64px;position:relative;display:grid;place-items:center}
.lvl svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lvl b{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.status .who{min-width:0;display:flex;flex-direction:column;gap:6px}
.status .who h3{font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s ease}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.85rem}
.goal{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding-top:12px;border-top:1px dashed var(--line);font-size:.9rem}
.goal .bar{flex:1}
.goal .bar>span{background:var(--das)}

/* modes */
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-1px);border-color:var(--muted)}
.mode:active{transform:scale(.99)}
.mode .ico{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.mode h3{font-size:1.05rem}
.mode p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.mode .go{font-size:1.3rem;color:var(--muted)}
.mode[disabled]{opacity:.55;cursor:default;transform:none}
.ico.blitz{background:var(--der-soft);color:var(--der)}
.ico.fall{background:var(--die-soft);color:var(--die)}
.ico.tresor{background:var(--das-soft);color:var(--das)}
.levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.levels .label{margin-right:4px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ranking */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pos{font-family:var(--f-display);font-weight:800;text-align:center;color:var(--muted)}
.rank li:nth-child(1) .pos{color:var(--gold)}
.rank .nm{min-width:0}
.rank .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{color:var(--muted)}
.rank .val{font-weight:700}
.rank li.me{background:linear-gradient(90deg,var(--gold-soft),transparent);margin-inline:-16px;padding-inline:16px}
.note{font-size:.85rem;color:var(--muted);margin:0}

.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pstats div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.pstats b{font-size:1.3rem}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.badge .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem;background:var(--sunk);color:var(--muted)}
.badge.on .medal{background:var(--gold);color:#1a1405}
.badge b{font-size:.8rem;line-height:1.2}
.badge small{font-size:.7rem;color:var(--muted);line-height:1.2}
.badge:not(.on) b{color:var(--muted)}
.album{display:flex;flex-direction:column;gap:8px}
.album .seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.album .seg span{height:100%}

/* game */
.game{min-height:100%;display:flex;flex-direction:column;gap:16px}
.ghead{display:flex;align-items:center;gap:12px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:1.2rem}
.ghead .bar{flex:1;height:10px}
.ghead .bar>span{background:var(--der);transition:width .2s linear}
.ghead .bar.fall>span{background:var(--die)}
.ghead .bar.tresor>span{background:var(--das)}
.gstats{display:flex;justify-content:space-between;align-items:center}
.combo{font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:1.1rem;min-height:1.5em}
.card{flex:1;min-height:240px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 18px;text-align:center;position:relative;overflow:hidden;transition:border-color .15s, background .15s}
.card .tag{position:absolute;top:14px;left:14px}
.card .case{position:absolute;top:14px;right:14px}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,3.1rem);line-height:1.05;overflow-wrap:anywhere}
.word .art{display:inline-block;margin-right:.25em}
.sentence{font-size:clamp(1.25rem,5.2vw,1.6rem);line-height:1.45;font-weight:700;max-width:30ch}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--muted);color:var(--muted);padding:0 .1em}
.blank.ok{border-color:var(--das);color:var(--das)}
.blank.bad{border-color:var(--die);color:var(--die)}
.card.ok{border-color:var(--das);background:var(--das-soft)}
.card.bad{border-color:var(--die);background:var(--die-soft)}
.hint{font-size:.98rem;max-width:36ch;margin:0}
.hint b{font-family:var(--f-display)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys.six{grid-template-columns:repeat(3,1fr)}
.key{border:0;border-radius:14px;padding:18px 6px;font-family:var(--f-display);font-weight:800;font-size:1.45rem;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s, box-shadow .08s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.key.k-der{background:var(--der)} .key.k-die{background:var(--die)} .key.k-das{background:var(--das)}
.keys.six .key{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.25rem;padding:14px 6px}
.key[disabled]{opacity:.5;cursor:default}
.next{border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;font-weight:700;font-size:1.05rem}
.kbd{font-size:.75rem;text-align:center;color:var(--muted)}

/* result */
.result{display:flex;flex-direction:column;gap:16px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--gold)}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:10px}
.hero .stats div{background:var(--sunk);border-radius:10px;padding:8px 4px}
.hero .stats b{display:block;font-size:1.2rem}
.lvlup{background:var(--gold);color:#1a1405;border-radius:14px;padding:14px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.mist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mist li{border-left:4px solid var(--line);padding:4px 0 4px 12px}
.mist li.m{border-color:var(--der)} .mist li.f{border-color:var(--die)} .mist li.n{border-color:var(--das)}
.mist small{display:block;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* onboarding */
.onb{display:flex;flex-direction:column;gap:12px}
.onb input{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.trio{display:flex;gap:8px;font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.trio span:nth-child(1){color:var(--der)} .trio span:nth-child(2){color:var(--die)} .trio span:nth-child(3){color:var(--das)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.ok{animation:pop .25s}
.card.bad{animation:shake .3s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><i class="d1">der</i><i>·</i><i class="d2">die</i><i>·</i><i class="d3">das</i>&nbsp;<span>Arena</span></div>
  </div>
  <div class="panel"><p class="note">Lade die Arena …</p></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================== DATEN ============================== */
const WORDS_RAW = {
B1: {
m:"Abschluss,Anfang,Antrag,Arbeitgeber,Ausflug,Ausweis,Bahnsteig,Beitrag,Berg,Beruf,Besuch,Betrieb,Bildschirm,Blick,Boden,Briefkasten,Drucker,Durst,Eindruck,Eingang,Erfolg,Fahrplan,Fehler,Feiertag,Gast,Gedanke,Geldbeutel,Geschmack,Grund,Hals,Honig,Hunger,Kalender,Kassenzettel,Käse,Keller,Kunde,Kühlschrank,Lärm,Lohn,Löffel,Mietvertrag,Müll,Nachbar,Nachteil,Ort,Pass,Rasen,Rat,Reis,Rest,Rücken,Schalter,Schlüssel,Schmerz,Schrank,Schreibtisch,Senf,Spiegel,Stau,Strom,Teppich,Termin,Topf,Umzug,Unfall,Unterschied,Urlaub,Verkehr,Vertrag,Vorteil,Wald,Wecker,Wunsch,Zahn,Zettel,Zug,Zweck,Tourist",
f:"Abfahrt,Absicht,Adresse,Ankunft,Anzeige,Apotheke,Ausbildung,Ausnahme,Bedingung,Bewerbung,Brille,Brücke,Decke,Dusche,Ecke,Einladung,Entscheidung,Erfahrung,Erkältung,Fahrkarte,Farbe,Feier,Firma,Flasche,Freiheit,Gabel,Gefahr,Gesundheit,Größe,Grenze,Haltestelle,Heimat,Hilfe,Hose,Jacke,Kasse,Kündigung,Lösung,Luft,Mannschaft,Meinung,Miete,Möglichkeit,Musik,Nachricht,Nähe,Pflanze,Prüfung,Quittung,Rechnung,Reise,Rente,Ruhe,Sache,Schachtel,Seife,Sorge,Speisekarte,Stelle,Strafe,Tasche,Tasse,Treppe,Tüte,Umgebung,Umwelt,Unterkunft,Untersuchung,Verabredung,Verantwortung,Versicherung,Wäsche,Wirtschaft,Wohnung,Zeitung,Zukunft,Zwiebel,Polizei",
n:"Abenteuer,Angebot,Ausland,Bett,Bild,Brot,Büro,Dach,Datum,Dorf,Ei,Einkommen,Ende,Ereignis,Ergebnis,Fach,Fahrrad,Fenster,Fieber,Formular,Frühstück,Gebäude,Gefühl,Gehalt,Gemüse,Gepäck,Gericht,Geschäft,Geschenk,Gesetz,Getränk,Glück,Handy,Heft,Hemd,Interesse,Jahrhundert,Kissen,Kleid,Konto,Krankenhaus,Licht,Mädchen,Medikament,Messer,Netz,Obst,Ohr,Paket,Pech,Problem,Rathaus,Rezept,Schild,Seil,Sofa,Spiel,Studium,Taschentuch,Thema,Tier,Tor,Treffen,Ufer,Vergnügen,Verhalten,Vertrauen,Wetter,Wissen,Zeugnis,Ziel,Zentrum,Zimmer,Museum"
},
B2: {
m:"Abstand,Anlass,Anspruch,Aufenthalt,Aufwand,Ausdruck,Ausgleich,Austausch,Autor,Beleg,Bereich,Bescheid,Bestandteil,Betrag,Bezug,Einfluss,Einwand,Empfang,Entwurf,Ertrag,Faktor,Fortschritt,Haushalt,Hinweis,Kompromiss,Konflikt,Kontakt,Kreislauf,Lehrling,Mangel,Maßstab,Motor,Nachweis,Praktikant,Rückgang,Ruf,Schaden,Standpunkt,Stoff,Streik,Tourismus,Umgang,Umsatz,Umstand,Verbrauch,Verdacht,Verlust,Verzicht,Versuch,Vorgang,Vorwurf,Wettbewerb,Widerspruch,Zugang,Zusammenhang,Zustand,Zweifel,Journalist",
f:"Abhängigkeit,Abteilung,Ahnung,Anforderung,Ausstattung,Auswirkung,Bäckerei,Bedeutung,Behörde,Belastung,Beziehung,Branche,Debatte,Ebene,Eigenschaft,Einrichtung,Energie,Entwicklung,Erlaubnis,Ernährung,Folge,Forderung,Gelegenheit,Gesellschaft,Gewohnheit,Haltung,Herausforderung,Herkunft,Kenntnis,Konkurrenz,Kritik,Kultur,Leistung,Maßnahme,Menge,Methode,Nachfrage,Natur,Politik,Qualität,Rolle,Schwierigkeit,Situation,Spannung,Stimmung,Strategie,Tätigkeit,Tendenz,Toleranz,Umfrage,Ursache,Veranstaltung,Verbindung,Vereinbarung,Vielfalt,Voraussetzung,Wahl,Wirkung,Zufriedenheit,Zusammenarbeit",
n:"Abitur,Abkommen,Album,Anliegen,Argument,Bedürfnis,Bewusstsein,Bündnis,Defizit,Dokument,Eigentum,Element,Engagement,Experiment,Fundament,Gebiet,Gedächtnis,Gegenteil,Gehirn,Gewicht,Gewissen,Gleichgewicht,Gymnasium,Hindernis,Instrument,Kapital,Klima,Konzept,Labor,Merkmal,Misstrauen,Muster,Niveau,Phänomen,Prinzip,Publikum,Restaurant,Risiko,Schicksal,Signal,Spektrum,Symptom,Talent,Unternehmen,Ventil,Verfahren,Verhältnis,Verständnis,Vorurteil,Wachstum,Werkzeug,Zertifikat,Zitat"
},
C1: {
m:"Ansatz,Aspekt,Aufschwung,Befund,Beschluss,Bestand,Diskurs,Durchbruch,Eingriff,Einklang,Engpass,Erlass,Gegensatz,Grundsatz,Indikator,Irrtum,Konsens,Kontext,Mechanismus,Missbrauch,Nachlass,Pessimismus,Rahmen,Realismus,Reichtum,Rückschlag,Spielraum,Stellenwert,Überblick,Umbruch,Verlauf,Verstoß,Vorbehalt,Vorsatz,Wandel,Wohlstand,Zerfall,Zuschlag,Zuwachs",
f:"Abwägung,Akzeptanz,Ambivalenz,Annahme,Aufklärung,Befugnis,Bilanz,Bürokratie,Diskrepanz,Distanz,Erkenntnis,Errungenschaft,Ethik,Fiktion,Gewährleistung,Hierarchie,Hypothese,Ideologie,Infrastruktur,Integrität,Intuition,Kompetenz,Konsequenz,Legitimität,Mentalität,Nachhaltigkeit,Prämisse,Resonanz,Rezession,Rhetorik,Sanktion,Skepsis,Souveränität,Subvention,Tragweite,Transparenz,Verjährung,Vernunft,Willkür,Würde,Zuversicht",
n:"Ausmaß,Credo,Dilemma,Ermessen,Fazit,Gefälle,Gremium,Gutachten,Indiz,Kollektiv,Kriterium,Monopol,Paradoxon,Pendant,Plädoyer,Postulat,Potenzial,Prestige,Privileg,Ressort,Resümee,Szenario,Terrain,Vakuum,Verhängnis,Vermögen,Versäumnis,Wagnis,Zugeständnis"
}};
const ART = {m:"der", f:"die", n:"das"};
const WORDS = []; const seen = new Set();
for (const lv of ["B1","B2","C1"]) for (const g of ["m","f","n"])
  for (const w of WORDS_RAW[lv][g].split(",")) { const t=w.trim(); if(!t||seen.has(t)) continue; seen.add(t); WORDS.push({w:t,g,lv}); }
const WORD_BY = Object.fromEntries(WORDS.map(x=>[x.w,x]));

/* Endungsregeln: Reihenfolge = Priorität */
const RULES = [
 ["ismus","m"],["schaft","f"],["heit","f"],["keit","f"],["chen","n"],["lein","n"],["ling","m"],["ment","n"],
 ["tum","n"],["ung","f"],["ion","f"],["tät","f"],["enz","f"],["anz","f"],["nis","n"],["ist","m"],["ant","m"],
 ["ik","f"],["ie","f"],["ei","f"],["ur","f"],["um","n"],["or","m"],["o","n"]
];
const RULE_NOTE = {
  nis:"Bei -nis ist es knifflig: meist <b>das</b> (das Ergebnis), aber einige sind <b>die</b> (die Erlaubnis, die Kenntnis).",
  tum:"-tum ist meist <b>das</b> (das Eigentum). Ausnahmen: der Irrtum, der Reichtum.",
  o:"Fremdwörter auf -o sind meist <b>das</b> (das Büro, das Konto).",
  ur:"Wörter auf -ur sind meist <b>die</b> (die Kultur). Ausnahme: das Abitur.",
  ung:"Ableitungen von Verben auf -ung sind <b>die</b>. Wörter wie der Schwung gehören nicht dazu."
};
const NO_RULE=new Set(["Streik","Spielraum"]); // Endung passt nur zufällig
function ruleFor(item){
  if(NO_RULE.has(item.w)) return null;
  const w=item.w.toLowerCase();

const LEX={};
for(const e of LEX_RAW.split(";")){ if(!e) continue; const [n,g,gen,w]=e.split(":"); LEX[n]={g,gen:gen||n,weak:w==="w"}; }
const ARTS={Nom:{m:"der",f:"die",n:"das"},Akk:{m:"den",f:"die",n:"das"},Dat:{m:"dem",f:"der",n:"dem"},Gen:{m:"des",f:"der",n:"des"}};
function buildCases(){
  const out=[];
  for(const [t,c,r,list] of FRAMES) for(const n of list.split(",")){
    const L=LEX[n]; if(!L){ console.warn("Lexikon fehlt:",n); continue; }
    const form=c==="Nom"?n:(c==="Gen"||L.weak)?L.gen:n;
    const a=ARTS[c][L.g], na=ARTS.Nom[L.g];
    out.push({s:t.replace("{}",form),a,c,r:`${r} · ${na} ${n}`+((a!==na||form!==n)?` → ${a} ${form}`:"")});
  }
  return out;
}

{ const have=new Set(CASES.map(q=>q.s)); for(const q of buildCases()) if(!have.has(q.s)){ have.add(q.s); CASES.push(q); } }

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function weekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-W"+String(Math.ceil(((t-y)/864e5+1)/7)).padStart(2,"0");}
function blankProfile(name){return {name,xp:0,weekXP:0,weekKey:weekKey(),dayXP:0,dayKey:today(),streak:0,bestStreak:0,lastDay:"",games:0,correct:0,total:0,bestCombo:0,caseOk:{},excOk:0,words:{},badges:[],updatedAt:0};}
function mastered(p,lv){let n=0;for(const [w,s] of Object.entries(p.words||{})){if(s[0]>=3 && (!lv||WORD_BY[w]?.lv===lv)) n++;}return n;}
function weakWords(p){return Object.entries(p.words||{}).filter(([w,s])=>s[0]===0 && s[2]>0 && WORD_BY[w]).map(([w])=>WORD_BY[w]);}

 flame:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-7 0-3.5-2.5-6-4-8-.3 2-1.3 3.2-2.5 3.5C13 7 11.5 4 9 2c.3 3-3 5.8-3 10 0 5.5 2.6 10 6 10z" fill="var(--gold)" stroke="var(--gold)"/></svg>`
};

/* ============================== RENDER ============================== */
function render(){
  const app=$("#app");
  if(S.view==="onboard") return renderOnboard(app);
  if(S.view==="game") return renderGame(app);
  if(S.view==="result") return renderResult(app);
  if(S.view==="rename") return renderRename(app);
  renderHome(app);
}

function topBar(){
  const p=S.me;
  return `<div class="top"><div class="brand"><i class="d1">der</i><i>·</i><i class="d2">die</i><i>·</i><i class="d3">das</i>&nbsp;<span>Arena</span></div><span class="spacer"></span>
  ${p?`<span class="chip" title="Tage in Folge gespielt">${ICON.flame}<span class="mono">${currentStreak(p)}</span></span>`:""}</div>`;
}
function currentStreak(p){ if(!p.lastDay) return 0; const y=new Date(); y.setDate(y.getDate()-1); const yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0"); return (p.lastDay===today()||p.lastDay===yk)?p.streak:0; }

function renderOnboard(app){
  app.innerHTML=`${topBar()}
  <div class="panel onb">
    <div class="trio"><span>der</span><span>die</span><span>das</span></div>
    <h2>Willkommen in der Arena</h2>
    <p class="muted" style="margin:0">Trainiere Artikel und Fälle in kurzen Runden, sammle XP und steig im Level auf. Wie sollen wir dich nennen?</p>
    <label class="label" for="nick">Dein Name</label>
    <input id="nick" maxlength="24" autocomplete="nickname" placeholder="z. B. Ana" value="${esc(S.suggestName||"")}">
    <button class="btn primary" id="startBtn">Los geht's</button>
  </div>`;
  const go=()=>{const n=$("#nick").value.trim().slice(0,24); if(!n){$("#nick").focus();return;} S.me=blankProfile(n); saveMe(); S.view="home"; render();};
  $("#startBtn").onclick=go; $("#nick").onkeydown=e=>{if(e.key==="Enter")go();};
}

function renderHome(app){
  const p=S.me, L=levelOf(p.xp), cur=xpFor(L), nxt=xpFor(L+1), pct=Math.min(100,(p.xp-cur)/(nxt-cur)*100);
  const dayXP=p.dayKey===today()?p.dayXP:0, gpct=Math.min(100,dayXP/DAILY_GOAL*100);
  const C=2*Math.PI*28, weak=weakWords(p).length;
  const nv=S.niveau;
  app.innerHTML=`${topBar()}
  <section class="status" aria-label="Dein Fortschritt">
    <div class="lvl" aria-label="Level ${L}">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle cx="32" cy="32" r="28" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <b>${L}</b>
    </div>
    <div class="who">
      <h3>${esc(p.name)}</h3>
      <div class="row"><span>${titleOf(L)}</span><span class="mono muted">${p.xp-cur} / ${nxt-cur} XP</span></div>
      <div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
    </div>
    <div class="goal"><span class="label">Tagesziel</span><div class="bar"><span style="width:${gpct}%"></span></div><span class="mono">${dayXP}/${DAILY_GOAL}</span></div>
  </section>

  <section class="modes" aria-label="Spielmodi">
    <div class="levels"><span class="label">Niveau</span>
      ${["B1","B2","C1","mix"].map(v=>`<button class="pill" data-nv="${v}" aria-pressed="${nv===v}">${v==="mix"?"Gemischt":v}</button>`).join("")}
    </div>
    <button class="mode" data-mode="blitz"><span class="ico blitz">60s</span><span><h3>Blitzrunde</h3><p>Der, die oder das? So viele Wörter wie möglich in 60 Sekunden.</p></span><span class="go">›</span></button>
    <button class="mode" data-mode="fall"><span class="ico fall">Fall</span><span><h3>Fall-Fallen</h3><p>10 Sätze aus ${CASES.length}: der, den, dem oder des? Nominativ bis Genitiv. ${Object.keys(p.caseSeen||{}).length} schon gespielt.</p></span><span class="go">›</span></button>
    <button class="mode" data-mode="tresor" ${weak?"":"disabled"}><span class="ico tresor mono">${weak}</span><span><h3>Problemwörter</h3><p>${weak?"Übe die Wörter, die du falsch hattest, bis sie sitzen.":"Noch leer. Falsche Wörter landen automatisch hier."}</p></span><span class="go">›</span></button>
  </section>

  <section class="panel" aria-label="Deine Bestwerte">
    <div class="panel-head"><h2>Deine Bestwerte</h2></div>
    <div class="pstats">
      <div><span class="label">Diese Woche</span><b class="mono">${p.weekKey===weekKey()?p.weekXP:0} XP</b></div>
      <div><span class="label">Beste Blitzrunde</span><b class="mono">${p.bestBlitz||0} XP</b></div>
      <div><span class="label">Beste Kombo</span><b class="mono">${p.bestCombo}</b></div>
      <div><span class="label">Trefferquote</span><b class="mono">${p.total?Math.round(p.correct/p.total*100)+" %":"–"}</b></div>
      <div><span class="label">Längste Serie</span><b class="mono">${p.bestStreak||0} Tage</b></div>
      <div><span class="label">Gespielte Runden</span><b class="mono">${p.games}</b></div>
    </div>
    <p class="note">Dein Fortschritt wird in diesem Browser gespeichert. Spiel deshalb immer auf demselben Gerät und im selben Browser.</p>
  </section>

  <section class="panel" aria-label="Wortsammlung">
    <div class="panel-head"><h2>Wortsammlung</h2><span class="mono muted">${mastered(p)} / ${WORDS.length}</span></div>
    <div class="album">
      ${["B1","B2","C1"].map(lv=>{const tot=WORDS.filter(w=>w.lv===lv).length, m=mastered(p,lv);return `<div class="row"><span><b>${lv}</b> <span class="muted">gemeistert</span></span><span class="mono">${m}/${tot}</span></div><div class="seg"><span style="width:${m/tot*100}%;background:${lv==="B1"?"var(--das)":lv==="B2"?"var(--der)":"var(--die)"}"></span></div>`;}).join("")}
      <p class="note">Ein Wort gilt als gemeistert, wenn du es dreimal hintereinander richtig hattest.</p>
    </div>
  </section>

  <section class="panel" aria-label="Abzeichen">
    <div class="panel-head"><h2>Abzeichen</h2><span class="mono muted">${p.badges.length} / ${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b=>{const on=p.badges.includes(b.id);return `<div class="badge ${on?"on":""}"><span class="medal">${on?"★":"·"}</span><b>${b.n}</b><small>${b.d}</small></div>`;}).join("")}</div>
  </section>
  <button class="btn" id="rename" style="align-self:center">Namen ändern</button>`;

  app.querySelectorAll("[data-nv]").forEach(b=>b.onclick=()=>{S.niveau=b.dataset.nv;try{localStorage.setItem("aa-niveau",S.niveau);}catch(e){}render();});
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>startGame(b.dataset.mode));
  $("#rename").onclick=()=>{S.view="rename";render();};
}
function renderRename(app){
  app.innerHTML=`${topBar()}<div class="panel onb"><h2>Namen ändern</h2><input id="nick" maxlength="24" value="${esc(S.me.name)}"><div class="btns"><button class="btn" id="cancel">Abbrechen</button><button class="btn primary" id="save">Speichern</button></div></div>`;
  $("#cancel").onclick=()=>{S.view="home";render();};
  $("#save").onclick=()=>{const n=$("#nick").value.trim().slice(0,24); if(!n) return; S.me.name=n; saveMe(); S.view="home"; render(); toast("Name gespeichert");};
}

/* ============================== SPIEL ============================== */
function poolWords(){ return S.niveau==="mix"?WORDS:WORDS.filter(w=>w.lv===S.niveau); }
function pickWord(g){
  const weak=weakWords(S.me).filter(w=>w!==g.last && (S.niveau==="mix"||w.lv===S.niveau));
  let item;
  if(weak.length && Math.random()<.3) item=weak[Math.random()*weak.length|0];
  else { const pool=poolWords(); do{ item=pool[Math.random()*pool.length|0]; }while(item===g.last && pool.length>1); }
  g.last=item; return item;
}
function startGame(mode){
  const g={mode,score:0,xp:0,combo:0,best:0,ok:0,n:0,mistakes:[],qi:0,locked:false,feedback:null,caseOk:{},excOk:0,wordUpd:{}};
  if(mode==="blitz"){ g.time=60; g.left=60; }
  if(mode==="fall"){ const seen=S.me.caseSeen||{}; g.qs=shuffle(CASES.map((q,i)=>({q,i,n:seen[q.s]||0}))).sort((a,b)=>a.n-b.n).slice(0,10).map(x=>x.q); }
  if(mode==="tresor"){ g.qs=shuffle(weakWords(S.me)).slice(0,15); }
  S.game=g; S.view="game"; nextQ(); render();
  if(mode==="blitz"){ g.t0=performance.now(); g.paused=0; g.timer=setInterval(tick,100); }
}
function tick(){
  const g=S.game; if(!g||g.mode!=="blitz") return;
  if(g.pauseAt) return;
  g.left=Math.max(0,g.time-(performance.now()-g.t0-g.paused)/1000);
  const b=$("#tbar"); if(b) b.style.width=(g.left/g.time*100)+"%";
  const t=$("#tleft"); if(t) t.textContent=Math.ceil(g.left)+" s";
  if(g.left<=0) endGame();
}
function nextQ(){
  const g=S.game; g.feedback=null; g.locked=false;
  if(g.mode==="blitz") g.cur=pickWord(g);
  else { if(g.qi>=g.qs.length) return endGame(true); g.cur=g.qs[g.qi]; }
}
function renderGame(app){
  const g=S.game, isFall=g.mode==="fall";
  const prog=g.mode==="blitz"?(g.left/g.time*100):(g.qi/g.qs.length*100);
  const fb=g.feedback;
  let body="";
  if(isFall){
    const q=g.cur; const parts=q.s.split("___");
    let fill=fb?fb.answer:"";
    if(fill && parts[0]==="") fill=fill[0].toUpperCase()+fill.slice(1);
    body=`<span class="label tag">Satz ${g.qi+1} / ${g.qs.length}</span>
      <p class="sentence">${esc(parts[0])}<span class="blank ${fb?(fb.ok?"ok":"bad"):""}">${fb?esc(fill):"&nbsp;"}</span>${esc(parts[1])}</p>
      ${fb?`<p class="hint">${fb.ok?"Richtig!":"Richtig wäre <b>"+esc(q.a)+"</b>."} <span class="muted">${CASE_NAME[q.c]}:</span> ${esc(q.r)}</p>`:""}`;
  } else {
    const it=g.cur;
    body=`<span class="label tag">${it.lv}</span>
      <div class="word">${fb?`<span class="art" style="color:var(--${ART[it.g]})">${ART[it.g]}</span>`:""}${esc(it.w)}</div>
      ${fb&&!fb.ok?`<p class="hint">${explain(it)}</p>`:""}`;
  }
  const keys=isFall?["der","die","das","den","dem","des"]:["der","die","das"];
  const needNext=fb && (isFall || (!fb.ok));
  app.innerHTML=`<div class="game">
    <div class="ghead"><button class="x" id="quit" aria-label="Runde beenden">×</button>
      <div class="bar ${g.mode}"><span id="tbar" style="width:${prog}%"></span></div>
      <span class="mono" id="tleft">${g.mode==="blitz"?Math.ceil(g.left)+" s":(g.qi)+"/"+g.qs.length}</span></div>
    <div class="gstats"><span class="mono"><b>${g.xp}</b> XP</span><span class="combo">${g.combo>=3?"Kombo ×"+g.combo:""}</span></div>
    <div class="card ${fb?(fb.ok?"ok":"bad"):""}" aria-live="polite">${body}</div>
    ${needNext?`<button class="next" id="next">Weiter</button><div class="kbd">Leertaste oder Enter</div>`
      :`<div class="keys ${isFall?"six":""}">${keys.map((k,i)=>`<button class="key k-${k}" data-a="${k}" ${fb?"disabled":""}>${k}</button>`).join("")}</div>
       <div class="kbd">${isFall?"":"Tastatur: 1 = der · 2 = die · 3 = das"}</div>`}
  </div>`;
  $("#quit").onclick=()=>endGame(false,true);
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(b.dataset.a));
  const nb=$("#next"); if(nb){ nb.onclick=cont; nb.focus(); }
}
function cont(){ const g=S.game; if(!g||!g.feedback) return;
  if(g.pauseAt){ g.paused+=performance.now()-g.pauseAt; g.pauseAt=0; }
  if(g.mode!=="blitz") g.qi++;
  nextQ(); if(S.view==="game") render(); }
function bumpWord(item,ok){
  const w=S.me.words[item.w]||[0,0,0]; // [box, richtig, falsch]
  const nw=ok?[Math.min(5,w[0]+1),w[1]+1,w[2]]:[0,w[1],w[2]+1];
  S.me.words[item.w]=nw;
}
function answer(a){
  const g=S.game; if(!g||g.locked) return; g.locked=true;
  let ok;
  if(g.mode==="fall"){ ok=a===g.cur.a; if(ok) g.caseOk[g.cur.c]=(g.caseOk[g.cur.c]||0)+1; const cs=S.me.caseSeen||(S.me.caseSeen={}); cs[g.cur.s]=ok?(cs[g.cur.s]||0)+1:0; }
  else { ok=a===ART[g.cur.g]; bumpWord(g.cur,ok); const r=ruleFor(g.cur); if(ok&&r&&!r.match) g.excOk++; }
  g.n++;
  if(ok){ g.ok++; g.combo++; g.best=Math.max(g.best,g.combo);
    const base=g.mode==="fall"?15:g.mode==="tresor"?12:10; const bonus=g.combo>=10?10:g.combo>=5?5:0; g.xp+=base+bonus; }
  else { g.combo=0; g.mistakes.push(g.mode==="fall"?{fall:g.cur,given:a}:{item:g.cur,given:a}); }
  g.feedback={ok,answer:a===undefined?"":(g.mode==="fall"?(ok?a:g.cur.a):a)};
  if(g.mode==="blitz"){
    if(ok){ render(); setTimeout(()=>{ if(S.game===g && g.feedback) cont(); },380); }
    else { g.pauseAt=performance.now(); render(); }
  } else if(g.mode==="tresor"){
    if(ok){ render(); setTimeout(()=>{ if(S.game===g && g.feedback) cont(); },600); } else render();
  } else render();
}
document.addEventListener("keydown",e=>{
  if(S.view!=="game"||!S.game) return;
  const g=S.game;
  if(g.feedback){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!g.feedback.ok||g.mode==="fall") cont(); } return; }
  const map=g.mode==="fall"?{"1":"der","2":"die","3":"das","4":"den","5":"dem","6":"des"}:{"1":"der","2":"die","3":"das"};
  if(map[e.key]) answer(map[e.key]);
});

function endGame(done,quit){
  const g=S.game; if(!g||g.ended) return; g.ended=true; clearInterval(g.timer);
  if(quit && g.n===0){ S.game=null; S.view="home"; render(); return; }
  const p=S.me, before=levelOf(p.xp), t=today(), wk=weekKey();
  // Serie
  if(p.lastDay!==t){ const y=new Date(); y.setDate(y.getDate()-1); const yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    p.streak=(p.lastDay===yk)?p.streak+1:1; p.lastDay=t; p.bestStreak=Math.max(p.bestStreak||0,p.streak); }
  // Tagesziel-Bonus
  if(p.dayKey!==t){ p.dayKey=t; p.dayXP=0; }
  let bonus=0; if(p.dayXP<DAILY_GOAL && p.dayXP+g.xp>=DAILY_GOAL) bonus=50;
  const gained=g.xp+bonus;
  p.dayXP+=g.xp; p.xp+=gained;
  if(p.weekKey!==wk){ p.weekKey=wk; p.weekXP=0; } p.weekXP+=gained;
  if(g.mode==="blitz") p.bestBlitz=Math.max(p.bestBlitz||0,g.xp);
  p.games++; p.correct+=g.ok; p.total+=g.n; p.bestCombo=Math.max(p.bestCombo,g.best);
  for(const [c,n] of Object.entries(g.caseOk)) p.caseOk[c]=(p.caseOk[c]||0)+n;
  p.excOk=(p.excOk||0)+g.excOk;
  const newB=BADGES.filter(b=>!p.badges.includes(b.id)&&b.t(p)); p.badges.push(...newB.map(b=>b.id));
  g.result={gained,bonus,levelUp:levelOf(p.xp)>before?levelOf(p.xp):0,newB};
  saveMe();
  S.view="result"; render();
}
function renderResult(app){
  const g=S.game, r=g.result, acc=g.n?Math.round(g.ok/g.n*100):0;
  const mist=g.mistakes.slice(0,12).map(m=>m.fall
    ? `<li><b>${esc(m.fall.s.startsWith("___")?m.fall.a[0].toUpperCase()+m.fall.a.slice(1)+m.fall.s.slice(3):m.fall.s.replace("___", m.fall.a))}</b><small>Du: ${esc(m.given)} · ${CASE_NAME[m.fall.c]}: ${esc(m.fall.r)}</small></li>`
    : `<li class="${m.item.g}">${explain(m.item)}<small>Du hast „${esc(m.given)}“ gewählt.</small></li>`).join("");
  app.innerHTML=`${topBar()}<div class="result">
    ${r.levelUp?`<div class="lvlup">Level ${r.levelUp} erreicht · ${titleOf(r.levelUp)}</div>`:""}
    <div class="hero"><span class="label">${g.mode==="blitz"?"Blitzrunde":g.mode==="fall"?"Fall-Fallen":"Problemwörter"}</span>
      <div class="big mono">+${r.gained}</div><span>XP${r.bonus?` · inkl. ${r.bonus} Bonus fürs Tagesziel`:""}</span>
      <div class="stats"><div><b class="mono">${g.ok}/${g.n}</b><small class="muted">richtig</small></div><div><b class="mono">${acc} %</b><small class="muted">Quote</small></div><div><b class="mono">${g.best}</b><small class="muted">beste Kombo</small></div></div>
    </div>
    ${r.newB.length?`<div class="panel"><h2>Neues Abzeichen</h2><div class="badges">${r.newB.map(b=>`<div class="badge on"><span class="medal">★</span><b>${b.n}</b><small>${b.d}</small></div>`).join("")}</div></div>`:""}
    ${mist?`<div class="panel"><h2>Das merkst du dir</h2><ul class="mist">${mist}</ul>${g.mode!=="fall"?`<p class="note">Diese Wörter liegen jetzt bei deinen Problemwörtern.</p>`:""}</div>`:`<div class="panel"><p class="note">Fehlerfrei. Stark!</p></div>`}
    <div class="btns"><button class="btn" id="home">Übersicht</button><button class="btn primary" id="again">Nochmal</button></div>
  </div>`;
  $("#home").onclick=()=>{S.game=null;S.view="home";render();};
  $("#again").onclick=()=>{const m=g.mode; if(m==="tresor"&&!weakWords(S.me).length){S.view="home";render();return;} startGame(m);};
}

/* ============================== SPEICHERN ============================== */
function saveMe(){ S.me.updatedAt=Date.now(); lsSet(LS_KEY,S.me); }

/* ============================== START ============================== */
const saved=lsGet(LS_KEY);
if(saved){ S.me=Object.assign(blankProfile(saved.name||"Du"),saved); S.view="home"; } else S.view="onboard";
render();
</script>
</body>
</html>
