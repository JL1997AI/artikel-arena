<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B57CF">
<title>Artikel-Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one narrow column, app-like; home = status + modes + ranking, game = full-focus card with three colour keys */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunk:#E6E9F0; --ink:#151924; --muted:#5B6274; --line:#D8DDE7;
  --der:#2B57CF; --die:#CF3535; --das:#178F5A; --gold:#C98A06; --gold-soft:#FBEFD2;
  --der-soft:#E3EAFB; --die-soft:#FBE4E4; --das-soft:#DDF3E8;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#171B24; --sunk:#202532; --ink:#ECEEF4; --muted:#9BA2B4; --line:#2A303D;
  --der:#7096FF; --die:#FF6E6E; --das:#3CCB8B; --gold:#F2BE3D; --gold-soft:#3A2F12;
  --der-soft:#1C2847; --die-soft:#40191B; --das-soft:#123528; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#171B24; --sunk:#202532; --ink:#ECEEF4; --muted:#9BA2B4; --line:#2A303D;
  --der:#7096FF; --die:#FF6E6E; --das:#3CCB8B; --gold:#F2BE3D; --gold-soft:#3A2F12;
  --der-soft:#1C2847; --die-soft:#40191B; --das-soft:#123528; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--der);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1;display:flex;gap:2px;align-items:baseline}
.brand i{font-style:normal}
.brand .d1{color:var(--der)} .brand .d2{color:var(--die)} .brand .d3{color:var(--das)}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.chip svg{width:16px;height:16px}

/* status card */
.status{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lvl{width:64px;height:64px;position:relative;display:grid;place-items:center}
.lvl svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lvl b{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.status .who{min-width:0;display:flex;flex-direction:column;gap:6px}
.status .who h3{font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s ease}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.85rem}
.goal{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding-top:12px;border-top:1px dashed var(--line);font-size:.9rem}
.goal .bar{flex:1}
.goal .bar>span{background:var(--das)}

/* modes */
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-1px);border-color:var(--muted)}
.mode:active{transform:scale(.99)}
.mode .ico{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.mode h3{font-size:1.05rem}
.mode p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.mode .go{font-size:1.3rem;color:var(--muted)}
.mode[disabled]{opacity:.55;cursor:default;transform:none}
.ico.blitz{background:var(--der-soft);color:var(--der)}
.ico.fall{background:var(--die-soft);color:var(--die)}
.ico.konj{background:var(--gold-soft);color:var(--gold)}
.ico.tresor{background:var(--das-soft);color:var(--das)}
.levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.levels .label{margin-right:4px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ranking */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pos{font-family:var(--f-display);font-weight:800;text-align:center;color:var(--muted)}
.rank li:nth-child(1) .pos{color:var(--gold)}
.rank .nm{min-width:0}
.rank .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{color:var(--muted)}
.rank .val{font-weight:700}
.rank li.me{background:linear-gradient(90deg,var(--gold-soft),transparent);margin-inline:-16px;padding-inline:16px}
.note{font-size:.85rem;color:var(--muted);margin:0}

.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pstats div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.pstats b{font-size:1.3rem}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.badge .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem;background:var(--sunk);color:var(--muted)}
.badge.on .medal{background:var(--gold);color:#1a1405}
.badge b{font-size:.8rem;line-height:1.2}
.badge small{font-size:.7rem;color:var(--muted);line-height:1.2}
.badge:not(.on) b{color:var(--muted)}
.album{display:flex;flex-direction:column;gap:8px}
.album .seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.album .seg span{height:100%}

/* game */
.game{min-height:100%;display:flex;flex-direction:column;gap:16px}
.ghead{display:flex;align-items:center;gap:12px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:1.2rem}
.ghead .bar{flex:1;height:10px}
.ghead .bar>span{background:var(--der);transition:width .2s linear}
.ghead .bar.fall>span{background:var(--die)}
.ghead .bar.tresor>span{background:var(--das)}
.ghead .bar.konj>span{background:var(--gold)}
.keys.four{grid-template-columns:repeat(2,1fr)}
.gstats{display:flex;justify-content:space-between;align-items:center}
.combo{font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:1.1rem;min-height:1.5em}
.card{flex:1;min-height:240px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 18px;text-align:center;position:relative;overflow:hidden;transition:border-color .15s, background .15s}
.card .tag{position:absolute;top:14px;left:14px}
.card .case{position:absolute;top:14px;right:14px}
.word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,3.1rem);line-height:1.05;overflow-wrap:anywhere}
.word .art{display:inline-block;margin-right:.25em}
.sentence{font-size:clamp(1.25rem,5.2vw,1.6rem);line-height:1.45;font-weight:700;max-width:30ch}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--muted);color:var(--muted);padding:0 .1em}
.blank.ok{border-color:var(--das);color:var(--das)}
.blank.bad{border-color:var(--die);color:var(--die)}
.card.ok{border-color:var(--das);background:var(--das-soft)}
.card.bad{border-color:var(--die);background:var(--die-soft)}
.hint{font-size:.98rem;max-width:36ch;margin:0}
.hint b{font-family:var(--f-display)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys.six{grid-template-columns:repeat(3,1fr)}
.key{border:0;border-radius:14px;padding:18px 6px;font-family:var(--f-display);font-weight:800;font-size:1.45rem;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s, box-shadow .08s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.key.k-der{background:var(--der)} .key.k-die{background:var(--die)} .key.k-das{background:var(--das)}
.keys.four .key{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.15rem;padding:14px 6px}
.keys.six .key{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.25rem;padding:14px 6px}
.key[disabled]{opacity:.5;cursor:default}
.next{border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;font-weight:700;font-size:1.05rem}
.kbd{font-size:.75rem;text-align:center;color:var(--muted)}

/* result */
.result{display:flex;flex-direction:column;gap:16px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--gold)}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:10px}
.hero .stats div{background:var(--sunk);border-radius:10px;padding:8px 4px}
.hero .stats b{display:block;font-size:1.2rem}
.lvlup{background:var(--gold);color:#1a1405;border-radius:14px;padding:14px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.mist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mist li{border-left:4px solid var(--line);padding:4px 0 4px 12px}
.mist li.m{border-color:var(--der)} .mist li.f{border-color:var(--die)} .mist li.n{border-color:var(--das)}
.mist small{display:block;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* onboarding */
.onb{display:flex;flex-direction:column;gap:12px}
.onb input{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.trio{display:flex;gap:8px;font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.trio span:nth-child(1){color:var(--der)} .trio span:nth-child(2){color:var(--die)} .trio span:nth-child(3){color:var(--das)}

.secret{background:var(--surface);border:2px solid var(--gold);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.secret h2{color:var(--gold)}
.secret.top{border-width:3px;box-shadow:0 0 0 6px var(--gold-soft)}
.secret .gift{border:0;background:var(--gold);color:#1a1405;border-radius:14px;padding:14px 22px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;animation:wiggle 1.6s ease-in-out infinite}
.secret img{width:100%;max-width:360px;border-radius:14px;display:block;animation:reveal .5s ease-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
@keyframes reveal{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.mystery{position:relative;width:100%;max-width:240px;margin:0 auto;aspect-ratio:335/597;border-radius:14px;overflow:hidden;background:var(--sunk);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mimg{position:absolute;inset:0;background-size:cover;background-position:center}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}
.tile{display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--muted);transition:background .6s,border-color .6s}
.tile:not(.open){background-image:repeating-linear-gradient(45deg,var(--sunk) 0 8px,var(--surface) 8px 16px)}
.tile.open{background:transparent;border-color:transparent}
.tile.fresh{animation:unveil 1.2s ease-out}
@keyframes unveil{0%{background:var(--gold);box-shadow:inset 0 0 0 4px var(--gold)}100%{background:transparent;box-shadow:inset 0 0 0 0 transparent}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card.ok{animation:pop .25s}
.card.bad{animation:shake .3s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap" id="app">
  <div class="top">

  <div class="panel"><p class="note">Loading the Arena …</p></div>

/* Endungsregeln: Reihenfolge = Priorität */
const RULES = [
 ["ismus","m"],["schaft","f"],["heit","f"],["keit","f"],["chen","n"],["lein","n"],["ling","m"],["ment","n"],
 ["tum","n"],["ung","f"],["ion","f"],["tät","f"],["enz","f"],["anz","f"],["nis","n"],["ist","m"],["ant","m"],
 ["ik","f"],["ie","f"],["ei","f"],["ur","f"],["um","n"],["or","m"],["o","n"]
];
const RULE_NOTE = {
  nis:"-nis is tricky: usually <b>das</b> (das Ergebnis), but some are <b>die</b> (die Erlaubnis, die Kenntnis).",
  tum:"-tum is usually <b>das</b> (das Eigentum). Exceptions: der Irrtum, der Reichtum.",
  o:"Loanwords ending in -o are usually <b>das</b> (das Büro, das Konto).",
  ur:"Words ending in -ur are usually <b>die</b> (die Kultur). Exception: das Abitur.",
  ung:"Nouns formed from verbs with -ung are always <b>die</b>. Words like der Schwung are not formed that way."
};
const NO_RULE=new Set(["Streik","Spielraum"]); // Endung passt nur zufällig
function ruleFor(item){
  if(NO_RULE.has(item.w)) return null;
  const w=item.w.toLowerCase();
  for(const [s,g] of RULES){ if(w.endsWith(s) && w.length>s.length+1) return {s,g,match:g===item.g}; }
  return null;
}
function explain(item){
  const art=ART[item.g], name=`<b>${art} ${item.w}</b>`;
  const r=ruleFor(item);
  if(r){
    const extra=RULE_NOTE[r.s]?` ${RULE_NOTE[r.s]}`:"";
    if(r.match) return `${name} – Rule: nouns ending in <b>-${r.s}</b> are ${gName(r.g)}.${extra}`;
    return `${name} – Exception! The usual rule is -${r.s} → ${ART[r.g]}.${extra}`;
  }
  if(item.g==="n" && /en$/.test(item.w)) return `${name} – Infinitives used as nouns (das Treffen, das Wissen) are always neuter.`;
  if(item.g==="n" && /^Ge/.test(item.w)) return `${name} – Many nouns starting with <b>Ge-</b> are neuter (das Gebäude, das Gefühl).`;
  if(item.g==="m" && /er$/.test(item.w))
    return `${name} – Many nouns ending in -er are masculine (der Drucker, der Keller), but not all (das Fenster).`;
  return `${name} – No rule helps here. Remember it by its colour: ${art==="der"?"blue":art==="die"?"red":"green"}.`;
}
function gName(g){return g==="m"?"masculine (der)":g==="f"?"feminine (die)":"neuter (das)";}

const LEX={};
for(const e of LEX_RAW.split(";")){ if(!e) continue; const [n,g,gen,w]=e.split(":"); LEX[n]={g,gen:gen||n,weak:w==="w"}; }
const ARTS={Nom:{m:"der",f:"die",n:"das"},Akk:{m:"den",f:"die",n:"das"},Dat:{m:"dem",f:"der",n:"dem"},Gen:{m:"des",f:"der",n:"des"}};
function buildCases(){
  const out=[];
  for(const [t,c,r,list] of FRAMES) for(const n of list.split(",")){
    const L=LEX[n]; if(!L){ console.warn("Lexikon fehlt:",n); continue; }
    const form=c==="Nom"?n:(c==="Gen"||L.weak)?L.gen:n;
    const a=ARTS[c][L.g], na=ARTS.Nom[L.g];
    out.push({s:t.replace("{}",form),a,c,r:`${r} · ${na} ${n}`+((a!==na||form!==n)?` → ${a} ${form}`:"")});
  }
  return out;
}

    if(ok>=2)   return {img:REWARD_IMGS[1],h:ok+" out of 10 correct!",p:"Tier 1 of 4. Get 4 for the next one.",btn:"Open reward"};
    return null;
  }

const TR_R=[

 [/Wechselpräposition, wo\? → Dativ/g,"two-way preposition, where? (wo?) → dative"],

 [/Akkusativobjekt \(wen\/was\?\)/g,"direct object, accusative (wen/was?)"],

 [/Akkusativobjekt/g,"direct object, accusative"],
 [/Subjekt \(was ist peinlich\?\)/g,"subject, nominative (was?)"],
 [/Subjekt \(wer\/was\?\)/g,"subject, nominative (wer/was?)"],
 [/^Subjekt/g,"subject, nominative"],
 [/Genitivattribut \(wessen\?\)/g,"possessive genitive (wessen?)"],

/* ============================== SPIEL ============================== */
function poolWords(){ return S.niveau==="mix"?WORDS:WORDS.filter(w=>w.lv===S.niveau); }
function pickWord(g){
  const weak=weakWords(S.me).filter(w=>w!==g.last && (S.niveau==="mix"||w.lv===S.niveau));
  let item;
  if(weak.length && Math.random()<.3) item=weak[Math.random()*weak.length|0];
  else { const pool=poolWords(); do{ item=pool[Math.random()*pool.length|0]; }while(item===g.last && pool.length>1); }
  g.last=item; return item;
}
function startGame(mode){
  const g={mode,score:0,xp:0,combo:0,best:0,ok:0,n:0,mistakes:[],qi:0,locked:false,feedback:null,caseOk:{},excOk:0,wordUpd:{}};
  if(mode==="blitz"){ g.time=60; g.left=60; }
  if(mode==="fall"){ const seen=S.me.caseSeen||{}; g.qs=shuffle(CASES.map((q,i)=>({q,i,n:seen[q.s]||0}))).sort((a,b)=>a.n-b.n).slice(0,10).map(x=>x.q); }
  if(mode==="konj"){ const seen=S.me.konjSeen||{}; g.qs=shuffle(KONJ.map(q=>({q,n:seen[q.s]||0}))).sort((a,b)=>a.n-b.n).slice(0,10).map(x=>({...x.q,opts:shuffle([x.q.a,...x.q.d])})); }
  if(mode==="tresor"){ g.qs=shuffle(weakWords(S.me)).slice(0,15); }
  S.game=g; S.view="game"; nextQ(); render();
  if(mode==="blitz"){ g.t0=performance.now(); g.paused=0; g.timer=setInterval(tick,100); }
}
function tick(){
  const g=S.game; if(!g||g.mode!=="blitz") return;
  if(g.pauseAt) return;
  g.left=Math.max(0,g.time-(performance.now()-g.t0-g.paused)/1000);
  const b=$("#tbar"); if(b) b.style.width=(g.left/g.time*100)+"%";
  const t=$("#tleft"); if(t) t.textContent=Math.ceil(g.left)+" s";
  if(g.left<=0) endGame();
}
function nextQ(){
  const g=S.game; g.feedback=null; g.locked=false;
  if(g.mode==="blitz") g.cur=pickWord(g);
  else { if(g.qi>=g.qs.length) return endGame(true); g.cur=g.qs[g.qi]; }
}
function renderGame(app){
  const g=S.game, isFall=g.mode==="fall", isKonj=g.mode==="konj";
  const prog=g.mode==="blitz"?(g.left/g.time*100):(g.qi/g.qs.length*100);
  const fb=g.feedback;
  let body="";
  if(isFall||isKonj){
    const q=g.cur; const parts=q.s.split("___");
    let fill=fb?fb.answer:"";
    if(fill && parts[0]==="") fill=fill[0].toUpperCase()+fill.slice(1);
    body=`<span class="label tag">Sentence ${g.qi+1} / ${g.qs.length}</span>
      <p class="sentence">${esc(parts[0])}<span class="blank ${fb?(fb.ok?"ok":"bad"):""}">${fb?esc(fill):"&nbsp;"}</span>${esc(parts[1])}</p>
      ${fb&&isKonj?konjHint(q,fb):fb?`<p class="hint">${fb.ok?"Correct!":"The answer is <b>"+esc(q.a)+"</b>."} <span class="muted">${CASE_NAME[q.c]}:</span> ${esc(q.r)}</p>`:""}`;
  } else {
    const it=g.cur;
    body=`<span class="label tag">${it.lv}</span>
      <div class="word">${fb?`<span class="art" style="color:var(--${ART[it.g]})">${ART[it.g]}</span>`:""}${esc(it.w)}</div>
      ${fb&&!fb.ok?`<p class="hint">${explain(it)}</p>`:""}`;
  }
  const keys=isKonj?g.cur.opts:isFall?["der","die","das","den","dem","des"]:["der","die","das"];
  const needNext=fb && (isFall || isKonj || (!fb.ok));
  app.innerHTML=`<div class="game">
    <div class="ghead"><button class="x" id="quit" aria-label="End round">×</button>
      <div class="bar ${g.mode}"><span id="tbar" style="width:${prog}%"></span></div>
      <span class="mono" id="tleft">${g.mode==="blitz"?Math.ceil(g.left)+" s":(g.qi)+"/"+g.qs.length}</span></div>
    <div class="gstats"><span class="mono"><b>${g.xp}</b> XP</span><span class="combo">${g.combo>=3?"Combo ×"+g.combo:""}</span></div>
    <div class="card ${fb?(fb.ok?"ok":"bad"):""}" aria-live="polite">${body}</div>
    ${needNext?`<button class="next" id="next">Next</button><div class="kbd">Space or Enter</div>`
      :`<div class="keys ${isFall?"six":isKonj?"four":""}">${keys.map((k,i)=>`<button class="key k-${k}" data-a="${k}" ${fb?"disabled":""}>${k}</button>`).join("")}</div>
       <div class="kbd">${isFall?"":isKonj?"Keyboard: 1–4":"Keyboard: 1 = der · 2 = die · 3 = das"}</div>`}
  </div>`;
  $("#quit").onclick=()=>endGame(false,true);
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(b.dataset.a));
  const nb=$("#next"); if(nb){ nb.onclick=cont; nb.focus(); }
}
function cont(){ const g=S.game; if(!g||!g.feedback) return;
  if(g.pauseAt){ g.paused+=performance.now()-g.pauseAt; g.pauseAt=0; }
  if(g.mode!=="blitz") g.qi++;
  nextQ(); if(S.view==="game") render(); }
function bumpWord(item,ok){
  const w=S.me.words[item.w]||[0,0,0]; // [box, richtig, falsch]
  const nw=ok?[Math.min(5,w[0]+1),w[1]+1,w[2]]:[0,w[1],w[2]+1];
  S.me.words[item.w]=nw;
}
function answer(a){
  const g=S.game; if(!g||g.locked) return; g.locked=true;
  let ok;
  if(g.mode==="fall"){ ok=a===g.cur.a; if(ok) g.caseOk[g.cur.c]=(g.caseOk[g.cur.c]||0)+1; const cs=S.me.caseSeen||(S.me.caseSeen={}); cs[g.cur.s]=ok?(cs[g.cur.s]||0)+1:0; }
  else if(g.mode==="konj"){ ok=a===g.cur.a; const ks=S.me.konjSeen||(S.me.konjSeen={}); ks[g.cur.s]=ok?(ks[g.cur.s]||0)+1:0; }
  else { ok=a===ART[g.cur.g]; bumpWord(g.cur,ok); const r=ruleFor(g.cur); if(ok&&r&&!r.match) g.excOk++; }
  g.n++;
  if(ok){ g.ok++; g.combo++; g.best=Math.max(g.best,g.combo);
    const base=(g.mode==="fall"||g.mode==="konj")?15:g.mode==="tresor"?12:10; const bonus=g.combo>=10?10:g.combo>=5?5:0; g.xp+=base+bonus; }
  else { g.combo=0; g.mistakes.push(g.mode==="fall"?{fall:g.cur,given:a}:g.mode==="konj"?{konj:g.cur,given:a}:{item:g.cur,given:a}); }
  g.feedback={ok,given:a,answer:a===undefined?"":((g.mode==="fall"||g.mode==="konj")?(ok?a:g.cur.a):a)};
  if(g.mode==="blitz"){
    if(ok){ render(); setTimeout(()=>{ if(S.game===g && g.feedback) cont(); },380); }
    else { g.pauseAt=performance.now(); render(); }
  } else if(g.mode==="tresor"){
    if(ok){ render(); setTimeout(()=>{ if(S.game===g && g.feedback) cont(); },600); } else render();
  } else render();
}
document.addEventListener("keydown",e=>{
  if(S.view!=="game"||!S.game) return;
  const g=S.game;
  if(g.feedback){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!g.feedback.ok||g.mode==="fall"||g.mode==="konj") cont(); } return; }
  const map=g.mode==="konj"?{"1":g.cur.opts[0],"2":g.cur.opts[1],"3":g.cur.opts[2],"4":g.cur.opts[3]}:g.mode==="fall"?{"1":"der","2":"die","3":"das","4":"den","5":"dem","6":"des"}:{"1":"der","2":"die","3":"das"};
  if(map[e.key]) answer(map[e.key]);
});

function endGame(done,quit){
  const g=S.game; if(!g||g.ended) return; g.ended=true; clearInterval(g.timer);
  if(quit && g.n===0){ S.game=null; S.view="home"; render(); return; }
  const p=S.me, before=levelOf(p.xp), t=today(), wk=weekKey(), piecesBefore=piecesOf(p.correct);
  // Serie
  if(p.lastDay!==t){ const y=new Date(); y.setDate(y.getDate()-1); const yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    p.streak=(p.lastDay===yk)?p.streak+1:1; p.lastDay=t; p.bestStreak=Math.max(p.bestStreak||0,p.streak); }
  // Tagesziel-Bonus
  if(p.dayKey!==t){ p.dayKey=t; p.dayXP=0; }
  let bonus=0; if(p.dayXP<DAILY_GOAL && p.dayXP+g.xp>=DAILY_GOAL) bonus=50;
  const gained=g.xp+bonus;
  p.dayXP+=g.xp; p.xp+=gained;
  if(p.weekKey!==wk){ p.weekKey=wk; p.weekXP=0; } p.weekXP+=gained;
  if(g.mode==="blitz") p.bestBlitz=Math.max(p.bestBlitz||0,g.xp);
  p.games++; p.correct+=g.ok; p.total+=g.n; p.bestCombo=Math.max(p.bestCombo,g.best);
  for(const [c,n] of Object.entries(g.caseOk)) p.caseOk[c]=(p.caseOk[c]||0)+n;
  p.excOk=(p.excOk||0)+g.excOk;
  if(g.mode==="konj") p.konjOk=(p.konjOk||0)+g.ok;
  const newB=BADGES.filter(b=>!p.badges.includes(b.id)&&b.t(p)); p.badges.push(...newB.map(b=>b.id));
  g.result={gained,bonus,levelUp:levelOf(p.xp)>before?levelOf(p.xp):0,newB,piecesBefore,piecesAfter:piecesOf(p.correct)};
  saveMe();
  S.view="result"; render();
}
function renderResult(app){
  const g=S.game, r=g.result, acc=g.n?Math.round(g.ok/g.n*100):0, rw=rewardFor(g.ok,g.mode);
  const fillS=(s,a)=>s.startsWith("___")?a[0].toUpperCase()+a.slice(1)+s.slice(3):s.replace("___",a);
  const mist=g.mistakes.slice(0,12).map(m=>m.konj
    ? `<li><b>${esc(fillS(m.konj.s,m.konj.a))}</b><small>You chose: ${esc(m.given)} · ${esc(KONJ_INFO[m.konj.a])}</small></li>`
    : m.fall
    ? `<li><b>${esc(m.fall.s.startsWith("___")?m.fall.a[0].toUpperCase()+m.fall.a.slice(1)+m.fall.s.slice(3):m.fall.s.replace("___", m.fall.a))}</b><small>You chose: ${esc(m.given)} · ${CASE_NAME[m.fall.c]}: ${esc(m.fall.r)}</small></li>`
    : `<li class="${m.item.g}">${explain(m.item)}<small>You chose “${esc(m.given)}”.</small></li>`).join("");
  app.innerHTML=`${topBar()}<div class="result">
    ${r.levelUp?`<div class="lvlup">Level ${r.levelUp} reached · ${titleOf(r.levelUp)}</div>`:""}
    <div class="hero"><span class="label">${g.mode==="blitz"?"Speed Round":g.mode==="fall"?"Case Traps":g.mode==="konj"?"Connectors":"Tricky Words"}</span>
      <div class="big mono">+${r.gained}</div><span>XP${r.bonus?` · incl. ${r.bonus} daily goal bonus`:""}</span>
      <div class="stats"><div><b class="mono">${g.ok}/${g.n}</b><small class="muted">correct</small></div><div><b class="mono">${acc} %</b><small class="muted">accuracy</small></div><div><b class="mono">${g.best}</b><small class="muted">best combo</small></div></div>
    </div>
    ${rw?`<div class="secret ${rw.top?"top":""}" id="secret"><span class="label">${rw.top?"Grand prize":"Secret reward"}</span><h2>${rw.h}</h2><p class="muted" style="margin:0">${rw.p}</p><button class="gift" id="gift">${rw.btn}</button></div>`:""}
    ${r.piecesAfter>r.piecesBefore?`<div class="panel"><h2>${r.piecesAfter>=MYSTERY_PIECES?"Mystery picture complete!":"New piece revealed!"}</h2>${mysteryHTML(r.piecesAfter,MYSTERY_ORDER[r.piecesAfter-1])}<p class="note">${r.piecesAfter} of ${MYSTERY_PIECES} pieces uncovered.</p></div>`:""}
    ${r.newB.length?`<div class="panel"><h2>New badge</h2><div class="badges">${r.newB.map(b=>`<div class="badge on"><span class="medal">★</span><b>${b.n}</b><small>${b.d}</small></div>`).join("")}</div></div>`:""}
    ${mist?`<div class="panel"><h2>Remember these</h2><ul class="mist">${mist}</ul>${(g.mode==="blitz"||g.mode==="tresor")?`<p class="note">These words are now in your Tricky Words.</p>`:""}</div>`:`<div class="panel"><p class="note">No mistakes. Great job!</p></div>`}
    <div class="btns"><button class="btn" id="home">Overview</button><button class="btn primary" id="again">Play again</button></div>
  </div>`;
  const gift=$("#gift"); if(gift) gift.onclick=()=>{ $("#secret").innerHTML=`<span class="label">Your reward</span><img src="${rw.img}" alt="Reward picture"><p class="muted" style="margin:0">${rw.top?"Can you do it again?":g.ok===0?"It’ll go better next time.":"Can you reach the next tier?"}</p>`; };
  $("#home").onclick=()=>{S.game=null;S.view="home";render();};
  $("#again").onclick=()=>{const m=g.mode; if(m==="tresor"&&!weakWords(S.me).length){S.view="home";render();return;} startGame(m);};
}

/* ============================== SPEICHERN ============================== */
function saveMe(){ S.me.updatedAt=Date.now(); lsSet(LS_KEY,S.me); }

/* ============================== START ============================== */
const saved=lsGet(LS_KEY);
if(saved){ S.me=Object.assign(blankProfile(saved.name||"You"),saved); S.view="home"; } else S.view="onboard";
render();
</script>
